<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoCorona</title>
    <link rel="stylesheet" href="./assets/styles/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="header-logo">
                    <a href="#">
                        <img src="./assets/img/Group 2.png" alt="" class="logo">
                    </a>
                </div>
                <span class="nav-burger-menu"></span>
                <nav class="header-nav">
                    <ul class="nav-list">
                        <li class="nav-item"><a href="#home">HOME</a></li>

                        <li class="nav-item"><a href="#support">SUPPORT</a></li>

                </div>
            </section>
            <section class="section" id="features">2</section>
            <section class="section" id="support">3</section>
